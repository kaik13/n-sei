name: Build e pacote Bloco
on:
  push:
    paths-ignore:
      - 'Zips/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-e-servidor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obter revisão
        uses: actions/checkout@v6
      - name: Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK pré-instalado
        run: |
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar painel e API
        run: npm test
      - name: Compilar interface
        run: npm run build
      - name: Compilar e verificar APK
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build:android 2>&1 | tee "$RUNNER_TEMP/bloco-android-build.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/bloco-android-build.log")
            details=${details//'%'/'%25'}
            details=${details//$'\n'/'%0A'}
            details=${details//$'\r'/'%0D'}
            echo "::error title=Detalhes do build Android::$details"
            exit 1
          fi
      - name: Criar e verificar ZIP
        env:
          BLOCO_ZIP_DIR: ${{ runner.temp }}/bloco-zips
        run: |
          npm run package:release
          unzip -t "$BLOCO_ZIP_DIR"/*.zip
      - name: Enviar pacote como artefato
        uses: actions/upload-artifact@v6
        with:
          name: bloco-android-servidor
          path: ${{ runner.temp }}/bloco-zips/*.zip
          if-no-files-found: error
          retention-days: 30
