name: Build e pacote Bloco
on:
  push:
    paths-ignore:
      - 'Zips/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: scripts/test-mobile-java.sh
  runtime-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar recursos para testes Android adicionais
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then echo '::notice title=Ambiente::KVM disponível no runner ARM64'; else echo '::notice title=Ambiente::KVM indisponível no runner ARM64'; fi
          if sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>/dev/null || grep -q binder /proc/filesystems; then
            echo '::notice title=Ambiente::Binder disponível para investigar Android em contêiner'
          else
            echo '::notice title=Ambiente::Binder indisponível no runner ARM64'
          fi
      - name: Compilar runtime ARM64
        shell: bash
        run: |
          set -o pipefail
          if ! scripts/build-mobile-runtime.sh "$RUNNER_TEMP/bloco-runtime" 2>&1 | tee "$RUNNER_TEMP/runtime.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/runtime.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Runtime ARM64::$details"
            exit 1
          fi
      - name: Testar Bedrock real e runtime
        shell: bash
        run: |
          set -o pipefail
          if ! scripts/test-mobile-java.sh "$RUNNER_TEMP/bloco-runtime/runtime.zip" 2>&1 | tee "$RUNNER_TEMP/mobile.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/mobile.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Servidor ARM64::$details"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-runtime-arm64
          path: |
            ${{ runner.temp }}/bloco-runtime/runtime.zip
            ${{ runner.temp }}/bloco-runtime/fontes/
          if-no-files-found: error
          retention-days: 7
  android:
    needs: [testes, runtime-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
      - uses: actions/download-artifact@v6
        with:
          name: bloco-runtime-arm64
          path: ${{ runner.temp }}/bloco-runtime
      - name: Preparar runtime verificado
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp "$RUNNER_TEMP/bloco-runtime/runtime.zip" mobile/android/app/src/main/assets/runtime.zip
      - name: Compilar e verificar APK
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build:android 2>&1 | tee "$RUNNER_TEMP/android.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/android.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Build Android::$details"
            exit 1
          fi
      - name: Criar e verificar ZIP
        env:
          BLOCO_ZIP_DIR: ${{ runner.temp }}/bloco-zips
          BLOCO_SOURCES_DIR: ${{ runner.temp }}/bloco-runtime/fontes
        run: |
          npm run package:release
          unzip -t "$BLOCO_ZIP_DIR"/*.zip
          mkdir "$RUNNER_TEMP/verificacao"
          unzip -q "$BLOCO_ZIP_DIR"/*.zip -d "$RUNNER_TEMP/verificacao"
          cd "$RUNNER_TEMP/verificacao"/Bloco-*-celular
          sha256sum -c SHA256SUMS.txt
          APK=$(echo Bloco-*.apk)
          java -jar "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" verify --verbose --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-android-celular
          path: ${{ runner.temp }}/bloco-zips/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preparar o APK exato do ZIP para teste
        run: |
          mkdir -p "$RUNNER_TEMP/apk-release"
          cp "$RUNNER_TEMP"/verificacao/Bloco-*-celular/Bloco-*.apk "$RUNNER_TEMP/apk-release/"
      - name: Guardar o APK exato do ZIP para teste
        uses: actions/upload-artifact@v6
        with:
          name: bloco-release-apk
          path: ${{ runner.temp }}/apk-release/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Compilar APK de diagnóstico, sem alterar o pacote de distribuição
        run: |
          sed -i 's/<application /<application android:debuggable="true" /' mobile/android/app/src/main/AndroidManifest.xml
          npm run build:android
          mkdir -p "$RUNNER_TEMP/apk-diagnostico"
          cp .android-build/Bloco-*.apk "$RUNNER_TEMP/apk-diagnostico/"
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-diagnostic-apk
          path: ${{ runner.temp }}/apk-diagnostico/*.apk
          if-no-files-found: error
          retention-days: 3

  android-arm64:
    needs: android
    uses: ./.github/workflows/android-container.yml

  publicar:
    # Only publish the exact revision tested on this working branch. PRs,
    # forks and manual dispatches can build artifacts, but cannot publish.
    if: github.event_name == 'push' && github.repository == 'kaik13/n-sei' && github.ref == 'refs/heads/arena/868095e0-n-sei'
    needs: [testes, runtime-arm64, android, android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v6
        with:
          name: bloco-android-celular
          path: ${{ runner.temp }}/pacote-validado
      - name: Publicar somente o novo ZIP, sem sobrescrever
        shell: bash
        run: |
          set -euo pipefail
          branch=arena/868095e0-n-sei
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REPOSITORY" == kaik13/n-sei && "$GITHUB_REF" == "refs/heads/$branch" ]]
          git fetch --no-tags origin "refs/heads/$branch"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || { echo 'A branch avançou; recusando publicar um pacote de outra revisão.' >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target="Zips/bloco-$version-android-celular.zip"
          source="$RUNNER_TEMP/pacote-validado/$(basename "$target")"
          [[ -f "$source" && ! -e "$target" ]] || { echo 'ZIP ausente ou versão já publicada; recusando sobrescrever.' >&2; exit 1; }
          unzip -tq "$source"
          mkdir -p Zips
          cp -- "$source" "$target"
          git add -- "$target"
          [[ "$(git diff --cached --name-only)" == "$target" ]]
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Distribuir Bloco $version (revisão ${GITHUB_SHA:0:12})"
          # A concurrent change makes this normal, non-force push fail safely.
          git push origin "HEAD:refs/heads/$branch"
