name: Build e pacote Bloco
on:
  push:
    paths-ignore:
      - 'Zips/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Testar painel, mundos e instalação verificada do Java ARM64
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/java-arm64.whl" \
            'https://files.pythonhosted.org/packages/9d/0c/24a7d8e4c96c3843b8163ba7a9be939b48fc181fb3263bd4fd9289ed8f41/jdk4py-21.0.8.2-py3-none-manylinux_2_17_aarch64.whl'
          echo '2519dce230b3ed13a93a3efed15c6b8b163aeacd77859ddf59eef3faa69c635d  '"$RUNNER_TEMP/java-arm64.whl" | sha256sum -c -
          BLOCO_JAVA_WHEEL="$RUNNER_TEMP/java-arm64.whl" scripts/test-mobile-java.sh
      - name: Testar reinício TCP e exclusão de listeners
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DBLOCO_TEST_HELPER -Imobile/native-box64 \
            mobile/test/tcp-restart-test.c -o "$RUNNER_TEMP/tcp-restart-test"
          "$RUNNER_TEMP/tcp-restart-test" baseline
          "$RUNNER_TEMP/tcp-restart-test" enabled
      - name: Verificar concorrência das listas de limpeza Box64 com AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v0.4.4 https://github.com/ptitSeb/box64 "$RUNNER_TEMP/box64-source"
          [[ "$(git -C "$RUNNER_TEMP/box64-source" rev-parse HEAD)" == 2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a ]]
          git -C "$RUNNER_TEMP/box64-source" apply --unidiff-zero "$GITHUB_WORKSPACE/mobile/native-box64/box64-cleanup-thread-safety.patch"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -DSTATICBUILD -pthread -fsanitize=address \
            -ffunction-sections -fdata-sections -I"$RUNNER_TEMP/box64-source/src" \
            -I"$RUNNER_TEMP/box64-source/src/include" -I"$RUNNER_TEMP/box64-source/src/elfs" \
            "$RUNNER_TEMP/box64-source/src/tools/cleanup.c" mobile/test/box64-cleanup-native-test.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/cleanup-test"
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=1 "$RUNNER_TEMP/cleanup-test"
      - name: Compilar e testar PRoot sob filtros seccomp simulados (x86_64)
        run: |
          set -euo pipefail
          python3 scripts/build-mobile-proot.py --abi x86_64 --output "$RUNNER_TEMP/proot-x86"
          python3 mobile/test/test-proot-seccomp.py "$RUNNER_TEMP/proot-x86"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pthread -fsanitize=address,undefined \
            -DBLOCO_TEST_HELPER -DBLOCO_TEST_GLIBC_FREE -Iscripts/native-proot \
            mobile/test/ifaddrs-test.c -o "$RUNNER_TEMP/ifaddrs-native"
          BLOCO_EXPECT_IOCTL=0 "$RUNNER_TEMP/ifaddrs-native"
          BLOCO_EXPECT_IOCTL=1 python3 mobile/test/seccomp-netlink.py "$RUNNER_TEMP/ifaddrs-native"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread mobile/test/ifaddrs-test.c -o "$RUNNER_TEMP/ifaddrs-guest"
          PROOT_NO_SECCOMP=1 "$RUNNER_TEMP/proot-x86" -r / -w / "$RUNNER_TEMP/ifaddrs-guest"
          PROOT_NO_SECCOMP=1 python3 mobile/test/seccomp-netlink.py \
            "$RUNNER_TEMP/proot-x86" -r / -w / "$RUNNER_TEMP/ifaddrs-guest"
          PROOT_NO_SECCOMP=1 GLIBC_TUNABLES=glibc.pthread.rseq=0 python3 mobile/test/seccomp-exec.py --deny-netlink \
            "$RUNNER_TEMP/proot-x86" -r / -w / "$RUNNER_TEMP/ifaddrs-guest"
  runtime-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar cliente offline NetherNet somente para testes
        run: npm ci --prefix mobile/nethernet-ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar recursos para testes Android adicionais
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then echo '::notice title=Ambiente::KVM disponível no runner ARM64'; else echo '::notice title=Ambiente::KVM indisponível no runner ARM64'; fi
          if sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>/dev/null || grep -q binder /proc/filesystems; then
            echo '::notice title=Ambiente::Binder disponível para investigar Android em contêiner'
          else
            echo '::notice title=Ambiente::Binder indisponível no runner ARM64'
          fi
      - name: Compilar runtime ARM64
        shell: bash
        run: |
          set -o pipefail
          if ! scripts/build-mobile-runtime.sh "$RUNNER_TEMP/bloco-runtime" 2>&1 | tee "$RUNNER_TEMP/runtime.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/runtime.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Runtime ARM64::$details"
            exit 1
          fi
      - name: Testar Java, Bedrock real e cliente em rede separada
        shell: bash
        run: |
          set -euo pipefail
          # A separate network namespace and veth make the client use another
          # IPv4 endpoint. This is still not a physical Android/Wi-Fi test.
          sudo ip netns add bloco-player
          trap 'sudo ip link del bloco-host 2>/dev/null || true; sudo ip netns del bloco-player 2>/dev/null || true' EXIT
          sudo ip link add bloco-host type veth peer name bloco-peer
          sudo ip link set bloco-peer netns bloco-player
          sudo ip addr add 10.234.230.1/30 dev bloco-host
          sudo ip link set bloco-host up
          sudo ip -n bloco-player addr add 10.234.230.2/30 dev bloco-peer
          sudo ip -n bloco-player link set lo up
          sudo ip -n bloco-player link set bloco-peer up
          export BLOCO_NETHER_TEST_NAMESPACE=bloco-player BLOCO_NETHER_TEST_HOST=10.234.230.1 BLOCO_NODE_BIN="$(command -v node)"
          if ! timeout --signal=TERM --kill-after=15s 18m scripts/test-mobile-java.sh "$RUNNER_TEMP/bloco-runtime/runtime.zip" 2>&1 | tee "$RUNNER_TEMP/mobile.log"; then
            details=$(grep -v 'Contents of server.properties:' "$RUNNER_TEMP/mobile.log" | tail -c 3500)
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Servidor ARM64::$details"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-runtime-arm64
          path: |
            ${{ runner.temp }}/bloco-runtime/runtime.zip
            ${{ runner.temp }}/bloco-runtime/fontes/
          if-no-files-found: error
          retention-days: 7
  android:
    needs: [testes, runtime-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/d8.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar"
      - uses: actions/download-artifact@v6
        with:
          name: bloco-runtime-arm64
          path: ${{ runner.temp }}/bloco-runtime
      - name: Preparar runtime verificado
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp "$RUNNER_TEMP/bloco-runtime/runtime.zip" mobile/android/app/src/main/assets/runtime.zip
      - name: Compilar e verificar APK
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build:android 2>&1 | tee "$RUNNER_TEMP/android.log"; then
            details=$(tail -c 10000 "$RUNNER_TEMP/android.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Build Android::$details"
            exit 1
          fi
      - name: Criar e verificar ZIP
        env:
          BLOCO_ZIP_DIR: ${{ runner.temp }}/bloco-zips
          BLOCO_SOURCES_DIR: ${{ runner.temp }}/bloco-runtime/fontes
        run: |
          npm run package:release
          unzip -t "$BLOCO_ZIP_DIR"/*.zip
          mkdir "$RUNNER_TEMP/verificacao"
          unzip -q "$BLOCO_ZIP_DIR"/*.zip -d "$RUNNER_TEMP/verificacao"
          cd "$RUNNER_TEMP/verificacao"/Bloco-*-celular
          sha256sum -c SHA256SUMS.txt
          APK=$(echo Bloco-*.apk)
          java -jar "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" verify --verbose --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-android-celular
          path: ${{ runner.temp }}/bloco-zips/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preparar o APK exato do ZIP para teste
        run: |
          mkdir -p "$RUNNER_TEMP/apk-release"
          cp "$RUNNER_TEMP"/verificacao/Bloco-*-celular/Bloco-*.apk "$RUNNER_TEMP/apk-release/"
      - name: Guardar o APK exato do ZIP para teste
        uses: actions/upload-artifact@v6
        with:
          name: bloco-release-apk
          path: ${{ runner.temp }}/apk-release/*.apk
          if-no-files-found: error
          retention-days: 3
      - name: Compilar APK de diagnóstico, sem alterar o pacote de distribuição
        run: |
          sed -i 's/<application /<application android:debuggable="true" /' mobile/android/app/src/main/AndroidManifest.xml
          npm run build:android
          mkdir -p "$RUNNER_TEMP/apk-diagnostico"
          cp .android-build/Bloco-*.apk "$RUNNER_TEMP/apk-diagnostico/"
      - uses: actions/upload-artifact@v6
        with:
          name: bloco-diagnostic-apk
          path: ${{ runner.temp }}/apk-diagnostico/*.apk
          if-no-files-found: error
          retention-days: 3

  android-arm64:
    needs: android
    uses: ./.github/workflows/android-container.yml

  publicar:
    # Only publish the exact revision tested on this working branch. PRs,
    # forks and manual dispatches can build artifacts, but cannot publish.
    # Publication is gated on every build, integration and exact-APK Android
    # test below, and is limited to trusted pushes on this working branch.
    if: ${{ github.event_name == 'push' && github.repository == 'kaik13/n-sei' && github.ref == 'refs/heads/arena/868095e0-n-sei' }}
    needs: [testes, runtime-arm64, android, android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v6
        with:
          name: bloco-android-celular
          path: ${{ runner.temp }}/pacote-validado
      - name: Publicar somente o novo ZIP, sem sobrescrever
        shell: bash
        run: |
          set -euo pipefail
          branch=arena/868095e0-n-sei
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REPOSITORY" == kaik13/n-sei && "$GITHUB_REF" == "refs/heads/$branch" ]]
          git fetch --no-tags origin "refs/heads/$branch"
          [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]] || { echo 'A branch avançou; recusando publicar um pacote de outra revisão.' >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target="Zips/bloco-$version-android-celular.zip"
          source="$RUNNER_TEMP/pacote-validado/$(basename "$target")"
          [[ -f "$source" && ! -e "$target" ]] || { echo 'ZIP ausente ou versão já publicada; recusando sobrescrever.' >&2; exit 1; }
          unzip -tq "$source"
          mkdir -p Zips
          cp -- "$source" "$target"
          git add -- "$target"
          [[ "$(git diff --cached --name-only)" == "$target" ]]
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Distribuir Bloco $version (revisão ${GITHUB_SHA:0:12})"
          # A concurrent change makes this normal, non-force push fail safely.
          git push origin "HEAD:refs/heads/$branch"
