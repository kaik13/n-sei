name: Build e pacote Bloco
on:
  push:
    paths-ignore:
      - 'Zips/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-e-servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter revisão
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar painel e API
        run: npm test
      - name: Compilar interface
        run: npm run build
      - name: Compilar e verificar APK
        run: npm run build:android
      - name: Criar e verificar ZIP
        env:
          BLOCO_ZIP_DIR: ${{ runner.temp }}/bloco-zips
        run: |
          npm run package:release
          unzip -t "$BLOCO_ZIP_DIR"/*.zip
      - name: Enviar pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bloco-android-servidor
          path: ${{ runner.temp }}/bloco-zips/*.zip
          if-no-files-found: error
          retention-days: 30
