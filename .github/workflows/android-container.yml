name: Teste Android ARM64 em contêiner
on:
  workflow_call:
    inputs:
      source_run_id:
        description: 'Execução anterior que produziu os APKs (vazio para a execução atual)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  android-arm64:
    # This validates an Android environment, not a physical phone. It uses a
    # privileged CI container with SELinux disabled and root only for test setup.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        android: ['13.0.0', '15.0.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: bloco-release-apk
          path: ${{ runner.temp }}/apk-release
          github-token: ${{ inputs.source_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
      - uses: actions/download-artifact@v6
        with:
          name: bloco-diagnostic-apk
          path: ${{ runner.temp }}/apk-diagnostico
          github-token: ${{ inputs.source_run_id != '' && github.token || '' }}
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
      - name: Preparar Android em contêiner ARM64
        shell: bash
        run: |
          set -e
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || grep -q binder /proc/filesystems
          sudo modprobe ashmem_linux || true
          docker run -d --rm --privileged --name bloco-android \
            -p 127.0.0.1:19132:19132/tcp -p 127.0.0.1:19142:19142/tcp \
            redroid/redroid:${{ matrix.android }}_64only-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 \
            androidboot.redroid_dpi=480 androidboot.redroid_gpu_mode=guest
          for attempt in $(seq 1 60); do
            if [ "$(docker exec bloco-android getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 5
          done
          details=$( { docker logs bloco-android 2>&1 || true; docker exec bloco-android sh -c 'getprop sys.boot_completed; getprop ro.product.cpu.abilist; logcat -d -t 40' 2>&1 || true; } | tail -c 4000 )
          details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
          echo "::error title=Android em contêiner não inicializou::$details"; exit 1
      - name: Preparar as duas versões anteriores com dados para o teste lado a lado
        shell: bash
        run: |
          set -euo pipefail
          for version in 2.0.2 2.0.3; do
            unzip -p "Zips/bloco-$version-android-celular.zip" "Bloco-$version-celular/Bloco-$version.apk" > "$RUNNER_TEMP/Bloco-$version.apk"
            ./mobile/test/adb-container.sh install -r "$RUNNER_TEMP/Bloco-$version.apk"
          done
          docker exec bloco-android sh -c '
            set -e
            for package in br.com.bloco.servidor br.com.bloco.servidor.teste; do
              a="/data/data/$package"
              owner=$(stat -c "%u:%g" "$a")
              p="$a/files/bloco/servidor/worlds/Bloco"
              mkdir -p "$p"
              printf "mundo-antigo-preservado\n" > "$p/level.dat"
              printf "dados-antigos-preservados\n" > "$a/files/bloco/dados-ci"
              chown -R "$owner" "$a/files"
            done
          '
      - name: Testar o APK assinado extraído do ZIP
        id: release_test
        # Still run the debuggable APK after a failure, but require this exact
        # release test to pass before the job (and publication) can succeed.
        continue-on-error: true
        shell: bash
        env:
          ADB: ./mobile/test/adb-container.sh
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/apk-release" -type f -name 'Bloco-*.apk')
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Esperado exatamente um APK de distribuição.' >&2; exit 1; }
          if ! python3 mobile/test/android-container-test.py --release "${apks[0]}" 2>&1 | tee "$RUNNER_TEMP/android-release.log"; then
            details=$(tail -c 6000 "$RUNNER_TEMP/android-release.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=APK de distribuição no Android em contêiner::$details"
            exit 1
          fi
      - name: Verificar coexistência e preservação da versão anterior
        shell: bash
        run: |
          set -euo pipefail
          docker exec bloco-android pm path br.com.bloco.servidor
          docker exec bloco-android pm path br.com.bloco.servidor.teste
          docker exec bloco-android pm path br.com.bloco.servidor.teste204
          docker exec bloco-android sh -c '
            set -e
            for package in br.com.bloco.servidor br.com.bloco.servidor.teste; do
              test "$(cat /data/data/$package/files/bloco/servidor/worlds/Bloco/level.dat)" = mundo-antigo-preservado
              test "$(cat /data/data/$package/files/bloco/dados-ci)" = dados-antigos-preservados
            done
          '
      - name: Remover apenas os dados do APK novo antes do diagnóstico
        run: docker exec bloco-android pm uninstall br.com.bloco.servidor.teste204
      - name: Diagnosticar inicialização, console e autenticação opcional
        shell: bash
        env:
          ADB: ./mobile/test/adb-container.sh
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/apk-diagnostico" -type f -name 'Bloco-*.apk')
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Esperado exatamente um APK de diagnóstico.' >&2; exit 1; }
          if ! python3 mobile/test/android-container-test.py "${apks[0]}" 2>&1 | tee "$RUNNER_TEMP/android-test.log"; then
            details=$(tail -c 6000 "$RUNNER_TEMP/android-test.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Teste Android em contêiner::$details"
            exit 1
          fi
      - name: Confirmar dados anteriores depois do diagnóstico
        run: |
          docker exec bloco-android sh -c '
            set -e
            for package in br.com.bloco.servidor br.com.bloco.servidor.teste; do
              test "$(cat /data/data/$package/files/bloco/servidor/worlds/Bloco/level.dat)" = mundo-antigo-preservado
              test "$(cat /data/data/$package/files/bloco/dados-ci)" = dados-antigos-preservados
            done
          '
      - name: Exigir sucesso do APK de distribuição
        if: ${{ always() && steps.release_test.outcome == 'failure' }}
        run: |
          echo 'O APK exato do ZIP falhou, mesmo que o diagnóstico tenha passado.' >&2
          exit 1
      - name: Remover contêiner
        if: always()
        run: docker rm -f bloco-android || true
