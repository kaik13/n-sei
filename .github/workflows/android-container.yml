name: Teste Android ARM64 em contêiner
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android-arm64:
    # This validates an Android environment, not a physical phone. It uses a
    # privileged CI container with SELinux disabled and root only for test setup.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        android: ['13.0.0', '15.0.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: bloco-release-apk
          path: ${{ runner.temp }}/apk-release
      - uses: actions/download-artifact@v6
        with:
          name: bloco-diagnostic-apk
          path: ${{ runner.temp }}/apk-diagnostico
      - name: Preparar Android em contêiner ARM64
        shell: bash
        run: |
          set -e
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || grep -q binder /proc/filesystems
          sudo modprobe ashmem_linux || true
          docker run -d --rm --privileged --name bloco-android \
            -p 127.0.0.1:19132:19132/tcp -p 127.0.0.1:19142:19142/tcp \
            redroid/redroid:${{ matrix.android }}_64only-latest \
            androidboot.redroid_width=1080 androidboot.redroid_height=1920 \
            androidboot.redroid_dpi=480 androidboot.redroid_gpu_mode=guest
          for attempt in $(seq 1 60); do
            if [ "$(docker exec bloco-android getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 5
          done
          details=$( { docker logs bloco-android 2>&1 || true; docker exec bloco-android sh -c 'getprop sys.boot_completed; getprop ro.product.cpu.abilist; logcat -d -t 40' 2>&1 || true; } | tail -c 4000 )
          details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
          echo "::error title=Android em contêiner não inicializou::$details"; exit 1
      - name: Testar o APK assinado extraído do ZIP
        shell: bash
        env:
          ADB: ./mobile/test/adb-container.sh
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/apk-release" -type f -name 'Bloco-*.apk')
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Esperado exatamente um APK de distribuição.' >&2; exit 1; }
          if ! python3 mobile/test/android-container-test.py --release "${apks[0]}" 2>&1 | tee "$RUNNER_TEMP/android-release.log"; then
            details=$(tail -c 6000 "$RUNNER_TEMP/android-release.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=APK de distribuição no Android em contêiner::$details"
            exit 1
          fi
      - name: Remover dados de teste antes do APK de diagnóstico
        run: docker exec bloco-android pm uninstall br.com.bloco.servidor
      - name: Diagnosticar inicialização, console e autenticação opcional
        shell: bash
        env:
          ADB: ./mobile/test/adb-container.sh
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/apk-diagnostico" -type f -name 'Bloco-*.apk')
          [[ ${#apks[@]} -eq 1 ]] || { echo 'Esperado exatamente um APK de diagnóstico.' >&2; exit 1; }
          if ! python3 mobile/test/android-container-test.py "${apks[0]}" 2>&1 | tee "$RUNNER_TEMP/android-test.log"; then
            details=$(tail -c 6000 "$RUNNER_TEMP/android-test.log")
            details=${details//'%'/'%25'}; details=${details//$'\n'/'%0A'}; details=${details//$'\r'/'%0D'}
            echo "::error title=Teste Android em contêiner::$details"
            exit 1
          fi
      - name: Remover contêiner
        if: always()
        run: docker rm -f bloco-android || true
